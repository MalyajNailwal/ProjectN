name: Native app smoke

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  app:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Bootstrap app and dashboard from clone
        run: python scripts/bootstrap.py
      - name: Clone and prepare a real scanner source
        run: |
          python scripts/clone_sources.py --path tools/web/technology-profiler/source
          python scripts/setup_native.py technology
          python scripts/clone_sources.py --verify --path tools/web/technology-profiler/source
      - name: Verify scanner setup entry point
        run: python scripts/setup_native.py --help
      - name: Run tests, then scan from the dashboard in a real browser
        run: python scripts/verify_native.py --require-stage technology --ui
