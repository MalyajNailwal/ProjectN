name: Windows source scanner smoke

on:
  workflow_dispatch:

jobs:
  scan:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install app and native package installer
        run: python -m pip install -e . uv
      - name: Clone pinned engine and rules source
        run: |
          python scripts/clone_sources.py --path tools/code/static-analyzer/source --path tools/code/static-analyzer/checks
      - name: Install matching Windows scanner runtime
        run: python scripts/setup_native.py semgrep
      - name: Run ProjectN's configured source analysis
        run: |
          tools/venvs/static-analyzer/Scripts/semgrep.exe --version
          python -c "import json, subprocess; spec = next(s for s in json.load(open('config/scanners.json', encoding='utf-8'))['scanners'] if s['id'] == 'static'); args = [a.format(root='.', output='semgrep.json', repo='app') for a in spec['args']]; import os; r = subprocess.run(['tools/venvs/static-analyzer/Scripts/semgrep.exe', *args], env={**os.environ, **spec.get('env', {})}); print('semgrep exit', r.returncode)"
          python -c "import json; d = json.load(open('semgrep.json', encoding='utf-8')); print('results', len(d['results']), 'files', len(d['paths']['scanned']), 'errors', len(d['errors'])); [print(e.get('type'), str(e.get('message') or e.get('long_msg'))[:300]) for e in d['errors'][:10]]"
