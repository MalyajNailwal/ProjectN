name: Windows rendered scan smoke

on:
  workflow_dispatch:

jobs:
  scan:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Bootstrap app and browser source
        run: |
          python scripts/bootstrap.py
          python -m pip install uv
          python scripts/clone_sources.py --path tools/web/browser-journeys/python-bindings
      - name: Install matching browser runtime
        run: python scripts/setup_native.py browser
      - name: Complete a rendered Full scan of the local fixture
        run: .venv/Scripts/python.exe scripts/smoke_local.py --profile full --require-stage browser
