rules:
  - id: public-env-secret
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      $NAME uses a browser-public prefix, so the build embeds its value in client
      JavaScript, but its name says it holds a secret. Anyone can read it from the
      site's bundle.
    metadata:
      category: security
      cwe: "CWE-200: Exposure of Sensitive Information to an Unauthorized Actor"
      fix: >-
        Rename the variable without the public prefix, read it only in server code
        (API route, server action, or backend), and rotate the value because it was
        already shipped to browsers.
    patterns:
      - pattern-either:
          - pattern: process.env.$NAME
          - pattern: import.meta.env.$NAME
      - metavariable-regex:
          metavariable: $NAME
          regex: ^(NEXT_PUBLIC|VITE|REACT_APP|EXPO_PUBLIC|NUXT_PUBLIC|GATSBY|PUBLIC)_\w*(SECRET|PRIVATE|SERVICE_ROLE|PASSWORD)\w*$

  - id: supabase-service-role-key
    languages: [regex]
    severity: ERROR
    message: >-
      A Supabase JWT with the service_role claim is written in this file. That key
      bypasses Row Level Security and gives full database access to whoever holds it.
    metadata:
      category: security
      cwe: "CWE-798: Use of Hard-coded Credentials"
      fix: >-
        Rotate the service_role key in the Supabase dashboard, remove it from the code
        and Git history, and keep it only in server-side secret storage. Browser code
        must use the anon key with Row Level Security.
    # The three alternatives are the base64url forms of "role":"service_role" at each byte offset of a JWT payload.
    pattern-regex: eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]*(?:InJvbGUiOiJzZXJ2aWNlX3JvbGUi|Jyb2xlIjoic2VydmljZV9yb2xlI|icm9sZSI6InNlcnZpY2Vfcm9sZS)[A-Za-z0-9_-]*\.[A-Za-z0-9_-]+
